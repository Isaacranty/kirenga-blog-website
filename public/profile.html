<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — Kirenga</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#f6f8fb; color:#0a1628; padding:24px }
    .card { max-width:520px; margin:24px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 6px 18px rgba(10,22,40,0.06) }
    img.avatar { width:120px; height:120px; object-fit:cover; border-radius:50%; border:4px solid #e8eef6 }
    .controls { margin-top:16px }
    input[type=file] { display:block; margin-top:8px }
    button { background:#c9a84c; color:#081226; border:none; padding:10px 14px; border-radius:6px; cursor:pointer; font-weight:700 }
    .note { margin-top:12px; font-size:0.9rem; color:#556 }
  </style>
</head>
<body>
  <div class="card">
    <h2>Your profile</h2>
    <div>
      <img id="profileImage" class="avatar" src="/icon-192.png" alt="avatar" />
    </div>
    <form id="avatarForm" class="controls">
      <label for="avatar">Choose a profile picture</label>
      <input id="avatar" name="avatar" type="file" accept="image/*" />
      <div style="margin-top:12px">
        <button type="submit">Upload</button>
      </div>
    </form>
    <div class="note">Tip: This example uses a local Express server to accept uploads. For production, use S3/Cloud Storage and secure authentication.</div>
  </div>

  <script src="/js/upload-profile.js"></script>
</body>
</html>
